# Rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Power management: sleep after 15 minutes of inactivity.
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to enable the four RGB underglow LEDs on nice!nano.
# CONFIG_ZMK_RGB_UNDERGLOW=y
